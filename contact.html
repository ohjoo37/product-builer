<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>제휴 및 협업 문의 | 마음 캡슐 뽑기 머신</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600;700;800;900&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      transition: background 0.3s ease, color 0.3s ease;
    }
    .font-hand {
      font-family: 'Gaegu', cursive, sans-serif;
    }
    body.dark-mode, html.dark body {
      background: linear-gradient(to bottom right, #090d16, #141124, #030712) !important;
      color: #f8fafc !important;
    }
    .card-glass {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
    }
    body.dark-mode .card-glass, html.dark .card-glass {
      background: rgba(15, 23, 42, 0.9) !important;
      border-color: rgba(255, 255, 255, 0.15) !important;
    }
  </style>
</head>
<body class="bg-gradient-to-br from-amber-50 via-rose-50 to-indigo-100 min-h-screen text-slate-800 dark:text-slate-100 flex flex-col justify-between">

  <!-- 상단 헤더 -->
  <header class="w-full max-w-2xl mx-auto px-4 pt-6 pb-4 flex items-center justify-between">
    <a href="index.html" class="flex items-center gap-2 group">
      <div class="w-9 h-9 rounded-2xl bg-gradient-to-tr from-pink-500 to-rose-400 flex items-center justify-center text-white shadow-md shadow-pink-200 group-hover:scale-105 transition-transform">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
          <path d="M2 12h20"></path>
        </svg>
      </div>
      <div>
        <h1 class="text-base font-bold bg-gradient-to-r from-pink-600 via-rose-600 to-purple-600 dark:from-pink-400 dark:via-rose-400 dark:to-purple-400 bg-clip-text text-transparent">마음 캡슐 뽑기</h1>
        <p class="text-[11px] text-slate-500 dark:text-slate-400 font-medium">제휴 및 협업 제안 센터</p>
      </div>
    </a>

    <!-- 테마 토글 -->
    <button id="themeToggleBtn" class="flex items-center justify-center w-9 h-9 rounded-full bg-white/80 hover:bg-white dark:bg-slate-800/90 dark:hover:bg-slate-800 border border-rose-200 dark:border-slate-700 shadow-sm text-slate-700 dark:text-amber-300 hover:shadow transition-all active:scale-95" title="테마 전환">
      <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
      <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
    </button>
  </header>

  <!-- 메인 문의 폼 컨테이너 -->
  <main class="w-full max-w-xl mx-auto px-4 py-4 flex-1 flex flex-col justify-center">
    
    <div class="card-glass rounded-3xl p-6 sm:p-8 shadow-2xl border border-rose-100 dark:border-slate-800 relative overflow-hidden">
      
      <!-- 상단 타이틀 -->
      <div class="text-center mb-6">
        <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-rose-500 to-pink-500 flex items-center justify-center text-white shadow-lg shadow-rose-200 dark:shadow-none mx-auto mb-3">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m22 2-7 20-4-9-9-4Z"/>
            <path d="M22 2 11 13"/>
          </svg>
        </div>
        <h2 class="text-xl sm:text-2xl font-bold text-slate-900 dark:text-white mb-1.5">제휴 및 협업 문의</h2>
        <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-300">
          '마음 캡슐 뽑기'와 함께 따뜻한 가치를 만들어갈 브랜드, 크리에이터 분들의 제안을 기다립니다.
        </p>
      </div>

      <!-- 성공 완료 메시지 (전송 후 노출) -->
      <div id="partnerSuccessBox" class="hidden py-10 flex flex-col items-center text-center">
        <div class="w-16 h-16 rounded-full bg-emerald-100 dark:bg-emerald-950/60 text-emerald-600 dark:text-emerald-400 flex items-center justify-center text-3xl mb-4 shadow-inner">
          🎉
        </div>
        <h3 class="text-lg font-bold text-slate-800 dark:text-slate-100 mb-2">제휴 문의가 성공적으로 접수되었습니다!</h3>
        <p class="text-xs sm:text-sm text-slate-600 dark:text-slate-300 leading-relaxed max-w-md mb-6">
          남겨주신 소중한 제안 내용은 담당 팀에서 꼼꼼히 검토한 후, 기재해주신 이메일로 빠른 시일 내에 답변드리겠습니다.
        </p>
        <div class="flex gap-3">
          <a href="index.html" class="px-5 py-2.5 bg-rose-500 hover:bg-rose-600 text-white rounded-xl text-xs sm:text-sm font-bold transition-all shadow-md active:scale-95">
            메인으로 돌아가기
          </a>
          <button id="resetFormBtn" class="px-5 py-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-200 rounded-xl text-xs sm:text-sm font-semibold transition-all">
            새 문의 작성하기
          </button>
        </div>
      </div>

      <!-- Formspree 연동 폼 -->
      <form id="partnershipForm" action="https://formspree.io/f/xgavnjnz" method="POST" class="space-y-4">
        <input type="hidden" name="_subject" value="[마음 캡슐 뽑기 - 웹페이지 문의] 새로운 제휴 제안이 접수되었습니다" />
        <input type="text" name="_gotcha" style="display:none !important;" tabindex="-1" autocomplete="off" />

        <div>
          <label for="partnerName" class="block text-xs sm:text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1.5">
            회사/단체명 또는 담당자 성함 <span class="text-rose-500">*</span>
          </label>
          <input type="text" id="partnerName" name="name" required placeholder="예: 마음스튜디오 / 홍길동"
            class="w-full px-4 py-2.5 rounded-xl text-xs sm:text-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-400 dark:focus:ring-rose-500 transition-all shadow-xs" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div>
            <label for="partnerEmail" class="block text-xs sm:text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1.5">
              회신받을 이메일 주소 <span class="text-rose-500">*</span>
            </label>
            <input type="email" id="partnerEmail" name="email" required placeholder="contact@example.com"
              class="w-full px-4 py-2.5 rounded-xl text-xs sm:text-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-400 dark:focus:ring-rose-500 transition-all shadow-xs" />
          </div>
          <div>
            <label for="partnerPhone" class="block text-xs sm:text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1.5">
              연락처 <span class="text-slate-400 font-normal">(선택)</span>
            </label>
            <input type="tel" id="partnerPhone" name="phone" placeholder="010-0000-0000"
              class="w-full px-4 py-2.5 rounded-xl text-xs sm:text-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-400 dark:focus:ring-rose-500 transition-all shadow-xs" />
          </div>
        </div>

        <div>
          <label for="partnerType" class="block text-xs sm:text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1.5">
            제휴 및 협업 분야 <span class="text-rose-500">*</span>
          </label>
          <select id="partnerType" name="inquiry_type" required
            class="w-full px-4 py-2.5 rounded-xl text-xs sm:text-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 focus:outline-none focus:ring-2 focus:ring-rose-400 dark:focus:ring-rose-500 transition-all shadow-xs cursor-pointer">
            <option value="콘텐츠/문구 제휴">따뜻한 글귀 및 콘텐츠 협업</option>
            <option value="브랜드/비즈니스 제휴">브랜드 마케팅 및 프로모션 협력</option>
            <option value="서비스 기능/임베드 제휴">웹사이트 임베드 및 위젯 연동</option>
            <option value="광고 및 스폰서십">광고 및 후원 문의</option>
            <option value="기타 제안">기타 제휴 및 제안</option>
          </select>
        </div>

        <div>
          <label for="partnerSubject" class="block text-xs sm:text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1.5">
            문의 제목 <span class="text-rose-500">*</span>
          </label>
          <input type="text" id="partnerSubject" name="subject_title" required placeholder="제안하시는 제휴의 핵심 내용을 적어주세요"
            class="w-full px-4 py-2.5 rounded-xl text-xs sm:text-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-400 dark:focus:ring-rose-500 transition-all shadow-xs" />
        </div>

        <div>
          <label for="partnerMessage" class="block text-xs sm:text-sm font-semibold text-slate-700 dark:text-slate-200 mb-1.5">
            상세 문의 및 제안 내용 <span class="text-rose-500">*</span>
          </label>
          <textarea id="partnerMessage" name="message" rows="5" required placeholder="협업 희망 방식, 기대 효과, 관련 포트폴리오나 링크 등을 상세히 작성해 주세요."
            class="w-full px-4 py-2.5 rounded-xl text-xs sm:text-sm bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 text-slate-800 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-400 dark:focus:ring-rose-500 transition-all shadow-xs resize-none"></textarea>
        </div>

        <div class="pt-1">
          <label class="flex items-start gap-2.5 cursor-pointer select-none">
            <input type="checkbox" id="partnerPrivacy" name="privacy_consent" required
              class="mt-1 rounded border-slate-300 dark:border-slate-600 text-rose-500 focus:ring-rose-400">
            <span class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
              제휴 문의 검토 및 회신을 위한 최소한의 개인정보(이름, 이메일, 연락처) 수집 및 이용에 동의합니다.
            </span>
          </label>
        </div>

        <div id="partnerErrorBox" class="hidden p-3.5 rounded-xl bg-rose-50 dark:bg-rose-950/60 border border-rose-200 dark:border-rose-900 text-xs sm:text-sm text-rose-600 dark:text-rose-300 font-medium"></div>

        <div class="pt-2">
          <button type="submit" id="partnerSubmitBtn"
            class="w-full py-3.5 px-6 bg-gradient-to-r from-rose-500 to-pink-500 hover:from-rose-600 hover:to-pink-600 text-white font-bold text-sm sm:text-base rounded-2xl shadow-lg shadow-rose-200 dark:shadow-none flex items-center justify-center gap-2 transition-all active:scale-[0.99] disabled:opacity-60 disabled:cursor-not-allowed cursor-pointer">
            <span>제휴 문의 제출하기</span>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"></line>
              <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
          </button>
        </div>
      </form>

    </div>

    <!-- 하단 돌아가기 링크 -->
    <div class="text-center mt-6">
      <a href="index.html" class="inline-flex items-center gap-1.5 text-xs sm:text-sm font-semibold text-slate-600 dark:text-slate-300 hover:text-rose-600 dark:hover:text-rose-400 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        <span>마음 캡슐 뽑기 홈으로 돌아가기</span>
      </a>
    </div>

  </main>

  <!-- Disqus 댓글 섹션 -->
  <section class="w-full max-w-xl mx-auto px-4 py-6">
    <div class="card-glass rounded-3xl p-5 sm:p-6 shadow-xl border border-rose-100 dark:border-slate-800">
      <div class="flex items-center gap-2 mb-4 pb-3 border-b border-slate-100 dark:border-slate-800">
        <div class="w-8 h-8 rounded-xl bg-rose-100 dark:bg-rose-950/60 text-rose-600 dark:text-rose-400 flex items-center justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
          </svg>
        </div>
        <div>
          <h3 class="text-sm font-bold text-slate-800 dark:text-slate-100">문의 및 소통 피드백</h3>
          <p class="text-[11px] text-slate-500 dark:text-slate-400">제휴 관련 공개 의견이나 문의 피드백을 남겨주세요 ✨</p>
        </div>
      </div>

      <!-- Disqus Embed -->
      <div id="disqus_thread"></div>
      <script>
          (function() {
          var d = document, s = d.createElement('script');
          s.src = 'https://productbuilder-l6ecimvfz1.disqus.com/embed.js';
          s.setAttribute('data-timestamp', +new Date());
          (d.head || d.body).appendChild(s);
          })();
      </script>
      <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript">comments powered by Disqus.</a></noscript>
    </div>
  </section>

  <!-- 푸터 -->
  <footer class="w-full text-center py-4 text-xs text-slate-500 dark:text-slate-400 font-medium">
    <p>© 마음 캡슐 뽑기 머신. Powered by Formspree.</p>
  </footer>

  <!-- 스크립트 -->
  <script>
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');
    const partnershipForm = document.getElementById('partnershipForm');
    const partnerSubmitBtn = document.getElementById('partnerSubmitBtn');
    const partnerErrorBox = document.getElementById('partnerErrorBox');
    const partnerSuccessBox = document.getElementById('partnerSuccessBox');
    const resetFormBtn = document.getElementById('resetFormBtn');

    function setTheme(isDark) {
      if (isDark) {
        document.body.classList.add('dark-mode');
        document.documentElement.classList.add('dark');
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
        localStorage.setItem('theme', 'dark');
      } else {
        document.body.classList.remove('dark-mode');
        document.documentElement.classList.remove('dark');
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
        localStorage.setItem('theme', 'light');
      }
    }

    themeToggleBtn.addEventListener('click', () => {
      setTheme(!document.body.classList.contains('dark-mode'));
    });

    const savedTheme = localStorage.getItem('theme');
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      setTheme(true);
    } else {
      setTheme(false);
    }

    if (partnershipForm) {
      partnershipForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        partnerErrorBox.classList.add('hidden');

        partnerSubmitBtn.disabled = true;
        const originalBtnHtml = partnerSubmitBtn.innerHTML;
        partnerSubmitBtn.innerHTML = `
          <svg class="animate-spin h-5 w-5 text-white inline-block mr-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
          </svg>
          <span>제휴 문의 전송 중...</span>
        `;

        try {
          const formData = new FormData(partnershipForm);
          const response = await fetch("https://formspree.io/f/xgavnjnz", {
            method: "POST",
            body: formData,
            headers: {
              'Accept': 'application/json'
            }
          });

          if (response.ok) {
            partnershipForm.reset();
            partnershipForm.classList.add('hidden');
            partnerSuccessBox.classList.remove('hidden');
            if (typeof confetti === 'function') {
              confetti({ particleCount: 50, spread: 70, origin: { y: 0.6 } });
            }
          } else {
            const resData = await response.json().catch(() => ({}));
            const errMsg = (resData && resData.errors && resData.errors.map(err => err.message).join(', ')) || "전송에 실패했습니다. 입력 내용을 확인해주세요.";
            throw new Error(errMsg);
          }
        } catch (err) {
          partnerErrorBox.textContent = `❌ ${err.message || "네트워크 오류가 발생했습니다. 잠시 후 다시 시도해 주세요."}`;
          partnerErrorBox.classList.remove('hidden');
        } finally {
          partnerSubmitBtn.disabled = false;
          partnerSubmitBtn.innerHTML = originalBtnHtml;
        }
      });
    }

    if (resetFormBtn) {
      resetFormBtn.addEventListener('click', () => {
        partnerSuccessBox.classList.add('hidden');
        partnershipForm.classList.remove('hidden');
      });
    }
  </script>
</body>
</html>
