<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800;900&family=Nanum+Myeongjo:wght@700;800&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .font-serif-quote {
      font-family: 'Nanum Myeongjo', serif;
    }
    .font-hand {
      font-family: 'Gaegu', cursive, sans-serif;
    }

    /* 네온 발광 스타일 */
    .neon-border {
      box-shadow: 0 0 15px rgba(244, 63, 94, 0.4), inset 0 0 15px rgba(244, 63, 94, 0.2);
    }
    .neon-light {
      box-shadow: 0 0 10px #fb7185, 0 0 20px #e11d48;
    }

    /* 3D 캡슐 볼 */
    .self-ball {
      border-radius: 50%;
      position: absolute;
      box-shadow: inset -4px -4px 7px rgba(0,0,0,0.35),
                  inset 4px 4px 7px rgba(255,255,255,0.7),
                  0 4px 8px rgba(0,0,0,0.2);
      transition: transform 0.3s ease;
    }

    /* 집게 갈퀴 스타일링 */
    .claw-arm-left {
      transform-origin: top right;
      transition: transform 0.25s ease-in-out;
    }
    .claw-arm-right {
      transform-origin: top left;
      transition: transform 0.25s ease-in-out;
    }
    .claw-closed .claw-arm-left {
      transform: rotate(26deg);
    }
    .claw-closed .claw-arm-right {
      transform: rotate(-26deg);
    }

    /* 기계 유리 반사 */
    .glass-glare {
      background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0.05) 45%, rgba(255,255,255,0) 55%, rgba(255,255,255,0.2) 100%);
    }

    /* 당첨 볼 펄스 */
    @keyframes dropPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 5px #fb7185); }
      50% { transform: scale(1.08); filter: drop-shadow(0 0 16px #f43f5e); }
    }
    .prize-pulse {
      animation: dropPulse 1.1s infinite ease-in-out;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between overflow-x-hidden selection:bg-rose-500 selection:text-white">

  <!-- 상단 네비게이션 헤더 -->

        <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-rose-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

        </svg>

  <!-- 크레인 머신 메인 스테이지 -->

        <!-- 전면 반사광 유리 레이어 -->

          <!-- 3방향 크레인 집게 갈퀴 -->

            <!-- 우측 갈퀴 -->

          </div>
        </div>

        <!-- 좌측 하단 수령 배출구 슈트 (구멍) -->
        <div class="absolute bottom-0 left-0 w-24 h-24 bg-gradient-to-tr from-black via-slate-950 to-slate-900 border-t-2 border-r-2 border-rose-500/40 rounded-tr-3xl z-10 p-1 flex items-center justify-center">

        <!-- 볼들이 쌓여있는 하단 필드 (좌측 배출구 제외 우측 영역에 밀집) -->

          <!-- JS에서 자아존중감 볼 24개를 입체 배치합니다 -->
        </div>
      </div>

      <!-- 기계 하부 컨트롤러 데스크 -->
      <div class="w-full bg-slate-900/90 rounded-2xl p-4 mt-3 border border-slate-700/80 shadow-inner flex flex-col gap-3">
        
        <div class="flex items-center justify-between">

              ▶

          <!-- 하강 & 잡기 대형 버튼 -->
          <div class="flex flex-col items-center">
            <button id="btnCatch" class="w-24 h-14 rounded-2xl bg-gradient-to-tr from-rose-600 to-pink-500 hover:from-rose-500 hover:to-pink-400 active:scale-95 border-2 border-rose-300 text-white font-extrabold text-sm tracking-wider shadow-lg shadow-rose-950 flex flex-col items-center justify-center transition-all neon-light">
              <span>GRAB!</span>
              <span class="text-[10px] opacity-80 font-normal">볼 집기</span>
            </button>

        </div>

        <!-- 하단 당첨 볼 수령 슬롯 트레이 -->

            <span class="text-xs text-slate-300 font-medium">당첨 배출구:</span>
          </div>
          <div id="prizeDropPocket" class="h-11 flex-1 flex items-center justify-end px-3">
            <span id="pocketPlaceholder" class="text-xs text-slate-500 italic">집게로 볼을 뽑아보세요!</span>
          </div>
        </div>

      </div>

    </div>

  </main>

    /* ==========================================================
     * 2. Web Audio API 신디사이저 효과음
     * ========================================================== */
    class RetroSound {
      constructor() {
        this.ctx = null;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }
      // 모터 이동음
      motorBeep() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.04, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.08);
      }
      // 집게 잡기 사운드
      clawClack() {
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(240, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.15);
      }
      // 당첨 팡파레
      fanfare() {
        this.init();
        const chords = [523.25, 659.25, 783.99, 1046.50];
        chords.forEach((freq, idx) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.08);
          gain.gain.setValueAtTime(0.25, this.ctx.currentTime + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + idx * 0.08 + 0.4);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + idx * 0.08);
          osc.stop(this.ctx.currentTime + idx * 0.08 + 0.4);
        });
      }
    }

    function initBalls() {

        ball.style.top = `${yPos}px`;

    function moveCrane(delta) {
      if (isBusy) return;
      currentTrolleyX = Math.max(minX, Math.min(maxX, currentTrolleyX + delta));
      craneTrolley.style.left = `${currentTrolleyX}px`;
      audio.motorBeep();
    }

    let moveInterval = null;
    function startContinuousMove(delta) {
      if (isBusy) return;
      moveCrane(delta);
      moveInterval = setInterval(() => moveCrane(delta), 90);
      joystickKnob.style.transform = `translateX(${delta > 0 ? 8 : -8}px)`;
    }
    function stopContinuousMove() {
      clearInterval(moveInterval);
      joystickKnob.style.transform = 'translateX(0px)';
    }

    function executeCatch() {

      craneWire.style.height = '180px';
      audio.motorBeep();

      // 2. 바닥 도달 후 집게 닫기
      setTimeout(() => {
        clawMech.classList.add('claw-closed');
        audio.clawClack();

        const isOverPit = currentTrolleyX < 85;
        const willCatch = !isOverPit && Math.random() > 0.08;

          currentBallTheme = BALL_COLORS[Math.floor(Math.random() * BALL_COLORS.length)];

              ♥
            </div>
          `;

        // 3. 상승 (원위치 복귀)

          craneWire.style.height = '24px';
          audio.motorBeep();

          // 4. 배출구(좌측 슈트 x=45)로 자동 이동
          setTimeout(() => {
            craneTrolley.style.transition = 'left 1s cubic-bezier(0.4, 0, 0.2, 1)';

            currentTrolleyX = 45;

            // 5. 배출구 위에서 집게 열기 & 볼 낙하
            setTimeout(() => {
              clawMech.classList.remove('claw-closed');
              audio.clawClack();
              clawBallMount.innerHTML = '';
              craneTrolley.style.transition = 'none';

              if (willCatch) {
                dropPrizeIntoPocket();

                showToast("아쉽게 볼을 놓쳤어요! 다시 도전해보세요.");
                isBusy = false;
                btnCatch.classList.remove('opacity-50');
              }
            }, 1100);

          }, 650);

        }, 450);

      }, 800);
    }

      pocketPlaceholder.style.display = 'none';

      navigator.clipboard.writeText(shareContent).then(() => {
        copyBtnLabel.textContent = '복사 완료! ✨';
        showToast("클립보드에 복사되었습니다!");
        setTimeout(() => { copyBtnLabel.textContent = '글귀+미션 복사'; }, 1600);
      });
    });

    /* ==========================================================
     * 8. 수집 보관함 드로어 UI
     * ========================================================== */
    function renderCollection() {
      const count = savedIds.length;
      collectedBadge.textContent = count;
      drawerCountText.textContent = `총 ${count}개의 자존감 볼을 수집했어요 (전체 ${SELF_ESTEEM_DB.length}개)`;

      if (count === 0) {
        collectedItemsList.innerHTML = `
          <div class="h-64 flex flex-col items-center justify-center text-center text-slate-500">
            <span class="text-3xl mb-2">🕹️</span>
            <p class="text-xs font-semibold">아직 모아둔 볼이 없어요.</p>
            <p class="text-[11px] text-slate-500 mt-1">크레인 머신을 조작해 첫 볼을 뽑아보세요!</p>
          </div>
        `;
        return;
      }

      collectedItemsList.innerHTML = '';
      [...savedIds].reverse().forEach(id => {
        const item = SELF_ESTEEM_DB.find(x => x.id === id);
        if (!item) return;

        const card = document.createElement('div');
        card.className = 'bg-slate-950/80 border border-slate-800 rounded-2xl p-3.5 space-y-2 text-left relative group hover:border-rose-500/40 transition-colors';
        card.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="text-[10px] font-bold px-2 py-0.5 rounded bg-rose-500/10 text-rose-300 border border-rose-500/30">
              ${item.category}
            </span>
            <span class="text-[11px] text-amber-300/80 font-medium">— ${item.source}</span>
          </div>
          <p class="text-xs font-serif-quote font-bold text-slate-200 leading-snug">
            "${item.quote}"
          </p>
          <div class="bg-slate-900 rounded-lg p-2 text-[11px] text-slate-400 border border-slate-800">
            <span class="text-rose-400 font-semibold">미션:</span> ${item.mission}
          </div>
        `;
        collectedItemsList.appendChild(card);
      });
    }

    openBoxBtn.addEventListener('click', () => {
      drawerOverlay.classList.remove('opacity-0', 'pointer-events-none');
      drawerPanel.classList.remove('translate-x-full');
    });
    function closeDrawer() {
      drawerOverlay.classList.add('opacity-0', 'pointer-events-none');
      drawerPanel.classList.add('translate-x-full');
    }
    closeBoxBtn.addEventListener('click', closeDrawer);
    drawerOverlay.addEventListener('click', (e) => {
      if (e.target === drawerOverlay) closeDrawer();
    });

    clearStorageBtn.addEventListener('click', () => {
      if (confirm("보관된 자존감 메시지를 모두 비울까요?")) {
        savedIds = [];
        localStorage.removeItem('collected_self_esteem_ids');
        renderCollection();
        showToast("보관함이 초기화되었습니다.");
      }
    });

    let toastTimeout = null;
    function showToast(msg) {
      toastMsg.textContent = msg;
      toast.classList.remove('opacity-0', 'pointer-events-none');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('opacity-0', 'pointer-events-none');
      }, 2300);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') moveCrane(-15);
      if (e.key === 'ArrowRight') moveCrane(15);
      if (e.key === ' ' || e.key === 'Enter') executeCatch();
      if (e.key === 'Escape') {
        closeModal();
        closeDrawer();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      initBalls();
      renderCollection();
    });
    window.addEventListener('resize', initBalls);
  </script>
</body>
</html>
